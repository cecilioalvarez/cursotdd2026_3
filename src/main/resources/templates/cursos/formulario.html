<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${curso.id == null} ? 'Nuevo curso' : 'Editar curso'">Nuevo curso</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4" style="max-width: 600px">
		<h1 class="mb-4" th:text="${curso.id == null} ? 'Nuevo curso' : 'Editar curso'">Nuevo curso</h1>

		<div th:if="${#fields.hasErrors('${curso.*}')}" class="alert alert-danger">
			Revisa los datos del formulario.
		</div>

		<form th:action="${curso.id == null} ? @{/cursos} : @{/cursos/{id}(id=${curso.id})}"
			th:object="${curso}" method="post">
			<div class="mb-3">
				<label for="titulo" class="form-label">Título</label>
				<input type="text" id="titulo" th:field="*{titulo}" class="form-control"
					th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'" required>
				<div class="invalid-feedback" th:errors="*{titulo}">El título es obligatorio</div>
			</div>
			<div class="mb-3">
				<label for="autor" class="form-label">Autor</label>
				<input type="text" id="autor" th:field="*{autor}" class="form-control"
					th:classappend="${#fields.hasErrors('autor')} ? 'is-invalid'" required>
				<div class="invalid-feedback" th:errors="*{autor}">El autor es obligatorio</div>
			</div>
			<div class="mb-3">
				<label for="precio" class="form-label">Precio (€, sin IVA)</label>
				<input type="number" id="precio" th:field="*{precio}" class="form-control"
					th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'"
					min="0" step="0.01" required>
				<div class="invalid-feedback">El precio debe ser un número.</div>
			</div>
			<button type="submit" class="btn btn-primary">Guardar</button>
			<a th:href="@{/cursos}" class="btn btn-secondary">Cancelar</a>
		</form>
	</div>
</body>
</html>
