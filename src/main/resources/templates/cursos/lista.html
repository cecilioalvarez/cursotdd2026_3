<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listado de cursos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="mb-0">Listado de cursos</h1>
			<a th:href="@{/cursos/nuevo}" class="btn btn-primary">Nuevo curso</a>
		</div>

		<div th:if="${#lists.isEmpty(cursos)}" class="alert alert-info">
			No hay cursos.
		</div>

		<table th:unless="${#lists.isEmpty(cursos)}" class="table table-striped table-hover">
			<thead class="table-dark">
				<tr>
					<th>Id</th>
					<th>Título</th>
					<th>Autor</th>
					<th class="text-end">Precio</th>
					<th class="text-end">Precio con IVA</th>
					<th class="text-end">Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="curso : ${cursos}">
					<td th:text="${curso.id}">1</td>
					<td th:text="${curso.titulo}">Java</td>
					<td th:text="${curso.autor}">Cecilio</td>
					<td class="text-end" th:text="${#numbers.formatDecimal(curso.precio, 1, 'POINT', 2, 'COMMA')} + ' €'">100,00 €</td>
					<td class="text-end" th:text="${#numbers.formatDecimal(curso.precioConIva, 1, 'POINT', 2, 'COMMA')} + ' €'">121,00 €</td>
					<td class="text-end text-nowrap">
						<a th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}" class="btn btn-sm btn-outline-secondary">Ver imparticiones</a>
						<a th:href="@{/cursos/{id}/editar(id=${curso.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
						<form th:action="@{/cursos/{id}/borrar(id=${curso.id})}" method="post" class="d-inline"
							onsubmit="return confirm('¿Seguro que quieres borrar este curso?');">
							<button type="submit" class="btn btn-sm btn-outline-danger">Borrar</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
