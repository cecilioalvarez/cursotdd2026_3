<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imparticiones</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h1 class="mb-0">Imparticiones</h1>
				<p class="text-muted mb-0" th:text="${curso.titulo}">Java desde cero</p>
			</div>
			<div class="text-nowrap">
				<a th:href="@{/cursos}" class="btn btn-secondary">Volver a cursos</a>
				<a th:href="@{/cursos/{id}/imparticiones/nueva(id=${curso.id})}" class="btn btn-primary">Nueva impartición</a>
			</div>
		</div>

		<div th:if="${#lists.isEmpty(imparticiones)}" class="alert alert-info">
			Este curso no tiene imparticiones.
		</div>

		<table th:unless="${#lists.isEmpty(imparticiones)}" class="table table-striped table-hover">
			<thead class="table-dark">
				<tr>
					<th>Id</th>
					<th>Nombre</th>
					<th>Fecha de inicio</th>
					<th>Fecha de fin</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="imparticion : ${imparticiones}">
					<td th:text="${imparticion.id}">1</td>
					<td th:text="${imparticion.nombre}">Noviembre 2026</td>
					<td th:text="${#temporals.format(imparticion.fechaInicio, 'dd/MM/yyyy')}">02/11/2026</td>
					<td th:text="${#temporals.format(imparticion.fechaFin, 'dd/MM/yyyy')}">06/11/2026</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
