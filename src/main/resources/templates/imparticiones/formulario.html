<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva impartición</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4" style="max-width: 600px">
		<h1 class="mb-0">Nueva impartición</h1>
		<p class="text-muted mb-4" th:text="${curso.titulo}">Java desde cero</p>

		<form th:action="@{/cursos/{id}/imparticiones(id=${curso.id})}" th:object="${imparticion}" method="post">
			<div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
				Revisa los datos del formulario.
			</div>

			<div class="mb-3">
				<label for="nombre" class="form-label">Nombre</label>
				<input type="text" id="nombre" th:field="*{nombre}" class="form-control"
					th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" required>
				<div class="invalid-feedback" th:errors="*{nombre}">El nombre es obligatorio</div>
			</div>
			<div class="mb-3">
				<label for="fechaInicio" class="form-label">Fecha de inicio</label>
				<input type="date" id="fechaInicio" th:field="*{fechaInicio}" class="form-control"
					th:classappend="${#fields.hasErrors('fechaInicio')} ? 'is-invalid'" required>
				<div class="invalid-feedback">La fecha de inicio es obligatoria.</div>
			</div>
			<div class="mb-3">
				<label for="fechaFin" class="form-label">Fecha de fin</label>
				<input type="date" id="fechaFin" th:field="*{fechaFin}" class="form-control"
					th:classappend="${#fields.hasErrors('fechaFin') or #fields.hasErrors('fechasEnOrden')} ? 'is-invalid'" required>
				<div class="invalid-feedback" th:if="${#fields.hasErrors('fechaFin')}">La fecha de fin es obligatoria.</div>
				<div class="invalid-feedback" th:errors="*{fechasEnOrden}">La fecha de fin no puede ser anterior a la de inicio</div>
			</div>
			<button type="submit" class="btn btn-primary">Guardar</button>
			<a th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}" class="btn btn-secondary">Cancelar</a>
		</form>
	</div>
</body>
</html>
